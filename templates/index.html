<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthMate-AI</title>
    <style>
        :root {
            --bg: #f4f8fb;
            --card: #ffffff;
            --primary: #1677ff;
            --primary-dark: #0d5fd1;
            --text: #172033;
            --muted: #718096;
            --border: #e5ebf2;
            --user: #e9f2ff;
            --bot: #f5f7fa;
            --shadow: 0 18px 50px rgba(22, 45, 80, 0.10);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #eef7ff, var(--bg));
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .app {
            width: min(100%, 980px);
            height: min(92vh, 820px);
            background: var(--card);
            border: 1px solid rgba(229, 235, 242, 0.9);
            border-radius: 24px;
            box-shadow: var(--shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: var(--primary);
            color: white;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 20px;
        }

        .title {
            flex: 1;
        }

        .title h1 {
            margin: 0;
            font-size: 20px;
        }

        .title p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #23834a;
            font-size: 12px;
            font-weight: 700;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #28a760;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 26px;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            margin-bottom: 18px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: min(78%, 720px);
            padding: 13px 16px;
            border-radius: 17px;
            line-height: 1.55;
            font-size: 14px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .message.bot .bubble {
            background: var(--bot);
            border-bottom-left-radius: 5px;
        }

        .message.user .bubble {
            background: var(--user);
            border-bottom-right-radius: 5px;
        }

        .welcome {
            text-align: center;
            padding: 34px 18px;
            color: var(--muted);
        }

        .welcome strong {
            display: block;
            color: var(--text);
            font-size: 18px;
            margin-bottom: 8px;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 18px;
        }

        .suggestion {
            border: 1px solid var(--border);
            background: white;
            color: var(--text);
            border-radius: 999px;
            padding: 9px 13px;
            cursor: pointer;
            font-size: 12px;
        }

        .suggestion:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .typing {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }

        .typing span {
            width: 6px;
            height: 6px;
            background: #9aa7b8;
            border-radius: 50%;
            animation: bounce 1s infinite;
        }

        .typing span:nth-child(2) { animation-delay: .15s; }
        .typing span:nth-child(3) { animation-delay: .30s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }

        .composer {
            border-top: 1px solid var(--border);
            padding: 16px;
            background: white;
        }

        form {
            display: flex;
            gap: 10px;
            max-width: 900px;
            margin: auto;
        }

        textarea {
            flex: 1;
            resize: none;
            min-height: 48px;
            max-height: 130px;
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 13px 15px;
            outline: none;
            font: inherit;
            font-size: 14px;
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.10);
        }

        button[type="submit"] {
            width: 48px;
            border: 0;
            border-radius: 15px;
            background: var(--primary);
            color: white;
            cursor: pointer;
            font-size: 18px;
            font-weight: 800;
        }

        button[type="submit"]:hover {
            background: var(--primary-dark);
        }

        button[type="submit"]:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .disclaimer {
            text-align: center;
            color: var(--muted);
            font-size: 10px;
            margin-top: 9px;
        }

        @media (max-width: 640px) {
            body {
                padding: 0;
            }

            .app {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }

            #chat {
                padding: 18px;
            }

            .bubble {
                max-width: 88%;
            }

            header {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <main class="app">
        <header>
            <div class="logo">H</div>
            <div class="title">
                <h1>HealthMate-AI</h1>
                <p>Health &amp; healthcare study assistant</p>
            </div>
            <div class="status">
                <span class="dot"></span>
                Online
            </div>
        </header>

        <section id="chat" aria-live="polite">
            <div id="welcome" class="welcome">
                <strong>What would you like to study?</strong>
                Ask about anatomy, physiology, pathology, pharmacology,
                nutrition, public health, or other health-science topics.
                <div class="suggestions">
                    <button class="suggestion" type="button"
                        data-question="Explain the cardiac cycle in simple terms.">
                        Cardiac cycle
                    </button>
                    <button class="suggestion" type="button"
                        data-question="What is inflammation and what are its main signs?">
                        Inflammation
                    </button>
                    <button class="suggestion" type="button"
                        data-question="Explain the difference between arteries and veins.">
                        Arteries vs veins
                    </button>
                </div>
            </div>
        </section>

        <div class="composer">
            <form id="chat-form">
                <textarea id="message"
                    placeholder="Ask a health-related study question..."
                    aria-label="Message"
                    rows="1"></textarea>
                <button id="send" type="submit" aria-label="Send">➤</button>
            </form>
            <div class="disclaimer">
                Educational use only. HealthMate-AI does not replace professional medical care.
            </div>
        </div>
    </main>

    <script>
        const chat = document.getElementById("chat");
        const welcome = document.getElementById("welcome");
        const form = document.getElementById("chat-form");
        const input = document.getElementById("message");
        const send = document.getElementById("send");

        const history = [];

        function addMessage(role, text) {
            if (welcome) welcome.remove();

            const wrapper = document.createElement("div");
            wrapper.className = `message ${role === "user" ? "user" : "bot"}`;

            const bubble = document.createElement("div");
            bubble.className = "bubble";
            bubble.textContent = text;

            wrapper.appendChild(bubble);
            chat.appendChild(wrapper);
            chat.scrollTop = chat.scrollHeight;
        }

        function addTyping() {
            const wrapper = document.createElement("div");
            wrapper.className = "message bot";
            wrapper.id = "typing";

            const bubble = document.createElement("div");
            bubble.className = "bubble";
            bubble.innerHTML = `
                <span class="typing">
                    <span></span><span></span><span></span>
                </span>
            `;

            wrapper.appendChild(bubble);
            chat.appendChild(wrapper);
            chat.scrollTop = chat.scrollHeight;
        }

        function removeTyping() {
            document.getElementById("typing")?.remove();
        }

        async function sendMessage(text) {
            const message = text.trim();
            if (!message || send.disabled) return;

            addMessage("user", message);
            history.push({ role: "user", text: message });

            input.value = "";
            input.style.height = "auto";
            send.disabled = true;
            addTyping();

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message,
                        history: history.slice(0, -1)
                    })
                });

                const data = await response.json();
                removeTyping();

                if (!response.ok) {
                    throw new Error(data.error || "Request failed");
                }

                addMessage("bot", data.answer);
                history.push({ role: "model", text: data.answer });
            } catch (error) {
                removeTyping();
                addMessage(
                    "bot",
                    "I couldn't process that question right now. Please try again."
                );
            } finally {
                send.disabled = false;
                input.focus();
            }
        }

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            sendMessage(input.value);
        });

        input.addEventListener("input", () => {
            input.style.height = "auto";
            input.style.height = Math.min(input.scrollHeight, 130) + "px";
        });

        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                form.requestSubmit();
            }
        });

        document.querySelectorAll(".suggestion").forEach((button) => {
            button.addEventListener("click", () => {
                sendMessage(button.dataset.question);
            });
        });
    </script>
</body>
</html>
